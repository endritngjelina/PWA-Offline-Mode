<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuVault - Professional Documentation Hub</title>
    <meta name="description" content="Professional documentation and note-taking app with full offline support">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <link rel="manifest" href="#" id="manifest-placeholder">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-primary);
            box-shadow: var(--shadow);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-online {
            background: #dcfce7;
            color: var(--success);
        }

        .status-offline {
            background: #fee2e2;
            color: var(--error);
        }

        .status-syncing {
            background: #fef3c7;
            color: var(--warning);
        }

        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            padding: 2rem;
        }

        .sidebar {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .sidebar h2 {
            margin-bottom: 1rem;
            color: var(--text-primary);
            font-size: 1.125rem;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .document-list {
            list-style: none;
        }

        .document-item {
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.5rem;
            border: 1px solid transparent;
        }

        .document-item:hover {
            background: var(--bg-tertiary);
            border-color: var(--border);
        }

        .document-item.active {
            background: var(--primary);
            color: white;
        }

        .document-title {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .document-meta {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .content-area {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .editor-toolbar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .toolbar-btn {
            padding: 0.5rem;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background: var(--bg-tertiary);
        }

        .toolbar-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .title-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            background: var(--bg-secondary);
        }

        .title-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .content-editor {
            width: 100%;
            min-height: 400px;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.8;
            resize: vertical;
            background: var(--bg-secondary);
        }

        .content-editor:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-primary);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .sync-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .search-container {
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-success {
            background: var(--success);
        }

        .toast-error {
            background: var(--error);
        }

        .toast-warning {
            background: var(--warning);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-primary);
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 1rem;
                padding: 1rem;
            }

            .header {
                padding: 1rem;
            }

            .sidebar {
                position: static;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                📚 DocuVault Pro
            </div>
            <div class="status-bar">
                <div class="status-indicator" id="connection-status">
                    <span class="status-dot">🟢</span>
                    <span>Online</span>
                </div>
                <div class="status-indicator" id="sync-status">
                    <span>✅ Synced</span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <aside class="sidebar">
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Search documents..." id="search-input">
                </div>
                
                <div class="action-buttons">
                    <button class="btn btn-primary" id="new-doc-btn">
                        ➕ New Document
                    </button>
                    <button class="btn btn-secondary" id="import-btn">
                        📁 Import
                    </button>
                    <button class="btn btn-secondary" id="export-btn">
                        📤 Export All
                    </button>
                    <button class="btn btn-secondary" id="sync-btn">
                        🔄 Force Sync
                    </button>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="doc-count">0</div>
                        <div class="stat-label">Documents</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="word-count">0</div>
                        <div class="stat-label">Words</div>
                    </div>
                </div>

                <h2>Documents</h2>
                <ul class="document-list" id="document-list"></ul>
                
                <div class="sync-indicator" id="sync-indicator">
                    <span>💾 Auto-save enabled</span>
                </div>
            </aside>

            <section class="content-area">
                <div class="editor-toolbar">
                    <button class="toolbar-btn" id="bold-btn" title="Bold">
                        <strong>B</strong>
                    </button>
                    <button class="toolbar-btn" id="italic-btn" title="Italic">
                        <em>I</em>
                    </button>
                    <button class="toolbar-btn" id="heading-btn" title="Heading">
                        H1
                    </button>
                    <button class="toolbar-btn" id="list-btn" title="List">
                        •
                    </button>
                    <button class="toolbar-btn" id="code-btn" title="Code">
                        &lt;/&gt;
                    </button>
                    <button class="toolbar-btn" id="quote-btn" title="Quote">
                        "
                    </button>
                </div>

                <input type="text" class="title-input" id="title-input" placeholder="Document Title">
                <textarea class="content-editor" id="content-editor" placeholder="Start writing your document..."></textarea>

                <div class="sync-indicator" id="save-indicator">
                    <span>💾 Changes saved automatically</span>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast notifications -->
    <div id="toast" class="toast"></div>

    <!-- Modal for import/export -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Modal Title</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // App state management
        class AppState {
            constructor() {
                this.documents = [];
                this.currentDocument = null;
                this.isOnline = navigator.onLine;
                this.syncQueue = [];
                this.lastSync = null;
                this.searchQuery = '';
                this.autoSaveTimer = null;
                this.init();
            }

            init() {
                this.loadFromStorage();
                this.setupEventListeners();
                this.updateUI();
                this.startAutoSave();
                this.registerServiceWorker();
            }

            loadFromStorage() {
                try {
                    const stored = localStorage.getItem('docuvault_data');
                    if (stored) {
                        const data = JSON.parse(stored);
                        this.documents = data.documents || [];
                        this.lastSync = data.lastSync;
                    }
                } catch (error) {
                    console.error('Error loading from storage:', error);
                }
            }

            saveToStorage() {
                try {
                    const data = {
                        documents: this.documents,
                        lastSync: this.lastSync,
                        version: '1.0'
                    };
                    localStorage.setItem('docuvault_data', JSON.stringify(data));
                } catch (error) {
                    console.error('Error saving to storage:', error);
                }
            }

            setupEventListeners() {
                // Network status
                window.addEventListener('online', () => {
                    this.isOnline = true;
                    this.updateConnectionStatus();
                    this.processSyncQueue();
                });

                window.addEventListener('offline', () => {
                    this.isOnline = false;
                    this.updateConnectionStatus();
                });

                // Document management
                document.getElementById('new-doc-btn').addEventListener('click', () => this.createNewDocument());
                document.getElementById('import-btn').addEventListener('click', () => this.showImportModal());
                document.getElementById('export-btn').addEventListener('click', () => this.exportAllDocuments());
                document.getElementById('sync-btn').addEventListener('click', () => this.forceSync());

                // Editor
                document.getElementById('title-input').addEventListener('input', (e) => {
                    if (this.currentDocument) {
                        this.currentDocument.title = e.target.value;
                        this.currentDocument.lastModified = new Date().toISOString();
                        this.debouncedSave();
                    }
                });

                document.getElementById('content-editor').addEventListener('input', (e) => {
                    if (this.currentDocument) {
                        this.currentDocument.content = e.target.value;
                        this.currentDocument.lastModified = new Date().toISOString();
                        this.debouncedSave();
                    }
                });

                // Search
                document.getElementById('search-input').addEventListener('input', (e) => {
                    this.searchQuery = e.target.value.toLowerCase();
                    this.updateDocumentList();
                });

                // Toolbar
                document.getElementById('bold-btn').addEventListener('click', () => this.formatText('bold'));
                document.getElementById('italic-btn').addEventListener('click', () => this.formatText('italic'));
                document.getElementById('heading-btn').addEventListener('click', () => this.formatText('heading'));
                document.getElementById('list-btn').addEventListener('click', () => this.formatText('list'));
                document.getElementById('code-btn').addEventListener('click', () => this.formatText('code'));
                document.getElementById('quote-btn').addEventListener('click', () => this.formatText('quote'));

                // Modal
                document.getElementById('close-modal').addEventListener('click', () => this.hideModal());
                document.getElementById('modal').addEventListener('click', (e) => {
                    if (e.target.id === 'modal') this.hideModal();
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch (e.key) {
                            case 'n':
                                e.preventDefault();
                                this.createNewDocument();
                                break;
                            case 's':
                                e.preventDefault();
                                this.saveCurrentDocument();
                                break;
                            case 'f':
                                e.preventDefault();
                                document.getElementById('search-input').focus();
                                break;
                        }
                    }
                });
            }

            createNewDocument() {
                const doc = {
                    id: Date.now().toString(),
                    title: 'Untitled Document',
                    content: '',
                    created: new Date().toISOString(),
                    lastModified: new Date().toISOString(),
                    wordCount: 0,
                    tags: []
                };
                
                this.documents.unshift(doc);
                this.currentDocument = doc;
                this.updateUI();
                this.saveToStorage();
                
                // Focus on title input
                setTimeout(() => {
                    document.getElementById('title-input').focus();
                    document.getElementById('title-input').select();
                }, 100);
                
                this.showToast('New document created', 'success');
            }

            selectDocument(docId) {
                this.currentDocument = this.documents.find(doc => doc.id === docId);
                this.updateUI();
            }

            deleteDocument(docId) {
                if (confirm('Are you sure you want to delete this document?')) {
                    this.documents = this.documents.filter(doc => doc.id !== docId);
                    if (this.currentDocument && this.currentDocument.id === docId) {
                        this.currentDocument = this.documents[0] || null;
                    }
                    this.updateUI();
                    this.saveToStorage();
                    this.showToast('Document deleted', 'warning');
                }
            }

            updateUI() {
                this.updateDocumentList();
                this.updateEditor();
                this.updateStats();
                this.updateConnectionStatus();
            }

            updateDocumentList() {
                const list = document.getElementById('document-list');
                const filteredDocs = this.documents.filter(doc => 
                    doc.title.toLowerCase().includes(this.searchQuery) ||
                    doc.content.toLowerCase().includes(this.searchQuery)
                );

                list.innerHTML = filteredDocs.map(doc => `
                    <li class="document-item ${this.currentDocument?.id === doc.id ? 'active' : ''}" 
                        onclick="app.selectDocument('${doc.id}')">
                        <div class="document-title">${doc.title}</div>
                        <div class="document-meta">
                            ${new Date(doc.lastModified).toLocaleDateString()} • ${doc.wordCount} words
                        </div>
                    </li>
                `).join('');
            }

            updateEditor() {
                const titleInput = document.getElementById('title-input');
                const contentEditor = document.getElementById('content-editor');
                
                if (this.currentDocument) {
                    titleInput.value = this.currentDocument.title;
                    contentEditor.value = this.currentDocument.content;
                    titleInput.disabled = false;
                    contentEditor.disabled = false;
                } else {
                    titleInput.value = '';
                    contentEditor.value = '';
                    titleInput.disabled = true;
                    contentEditor.disabled = true;
                }
            }

            updateStats() {
                const docCount = document.getElementById('doc-count');
                const wordCount = document.getElementById('word-count');
                
                docCount.textContent = this.documents.length;
                wordCount.textContent = this.documents.reduce((total, doc) => total + doc.wordCount, 0);
            }

            updateConnectionStatus() {
                const status = document.getElementById('connection-status');
                if (this.isOnline) {
                    status.className = 'status-indicator status-online';
                    status.innerHTML = '<span>🟢</span><span>Online</span>';
                } else {
                    status.className = 'status-indicator status-offline';
                    status.innerHTML = '<span>🔴</span><span>Offline</span>';
                }
            }

            startAutoSave() {
                this.debouncedSave = this.debounce(() => {
                    this.saveCurrentDocument();
                }, 1000);
            }

            saveCurrentDocument() {
                if (this.currentDocument) {
                    // Update word count
                    this.currentDocument.wordCount = this.currentDocument.content.split(/\s+/).filter(word => word.length > 0).length;
                    
                    this.saveToStorage();
                    this.updateStats();
                    
                    // Show save indicator
                    const indicator = document.getElementById('save-indicator');
                    indicator.innerHTML = '<span>💾 Saved</span>';
                    setTimeout(() => {
                        indicator.innerHTML = '<span>💾 Changes saved automatically</span>';
                    }, 2000);
                }
            }

            formatText(type) {
                const editor = document.getElementById('content-editor');
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const selectedText = editor.value.substring(start, end);
                let replacement = '';

                switch (type) {
                    case 'bold':
                        replacement = `**${selectedText}**`;
                        break;
                    case 'italic':
                        replacement = `*${selectedText}*`;
                        break;
                    case 'heading':
                        replacement = `# ${selectedText}`;
                        break;
                    case 'list':
                        replacement = `- ${selectedText}`;
                        break;
                    case 'code':
                        replacement = `\`${selectedText}\``;
                        break;
                    case 'quote':
                        replacement = `> ${selectedText}`;
                        break;
                }

                editor.value = editor.value.substring(0, start) + replacement + editor.value.substring(end);
                editor.focus();
                editor.setSelectionRange(start + replacement.length, start + replacement.length);
                
                if (this.currentDocument) {
                    this.currentDocument.content = editor.value;
                    this.currentDocument.lastModified = new Date().toISOString();
                    this.debouncedSave();
                }
            }

            showImportModal() {
                const modal = document.getElementById('modal');
                const title = document.getElementById('modal-title');
                const body = document.getElementById('modal-body');
                
                title.textContent = 'Import Documents';
                body.innerHTML = `
                    <div>
                        <label for="file-input" style="display: block; margin-bottom: 1rem;">
                            <strong>Select JSON file to import:</strong>
                        </label>
                        <input type="file" id="file-input" accept=".json" style="margin-bottom: 1rem;">
                        <button class="btn btn-primary" onclick="app.importDocuments()">Import</button>
                    </div>
                `;
                
                modal.classList.add('show');
            }

            importDocuments() {
                const fileInput = document.getElementById('file-input');
                const file = fileInput.files[0];
                
                if (!file) {
                    this.showToast('Please select a file', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.documents && Array.isArray(data.documents)) {
                            this.documents = [...this.documents, ...data.documents];
                            this.updateUI();
                            this.saveToStorage();
                            this.hideModal();
                            this.showToast(`Imported ${data.documents.length} documents`, 'success');
                        } else {
                            this.showToast('Invalid file format', 'error');
                        }
                    } catch (error) {
                        this.showToast('Error reading file', 'error');
                    }
                };
                reader.readAsText(file);
            }

            exportAllDocuments() {
                const data = {
                    documents: this.documents,
                    exportDate: new Date().toISOString(),
                    version: '1.0'
                };
                
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `docuvault-export-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                
                this.showToast('Documents exported successfully', 'success');
            }

            forceSync() {
                const syncStatus = document.getElementById('sync-status');
                syncStatus.className = 'status-indicator status-syncing';
                syncStatus.innerHTML = '<div class="spinner"></div><span>Syncing...</span>';
                
                // Simulate sync process
                setTimeout(() => {
                    this.lastSync = new Date().toISOString();
                    this.saveToStorage();
                    syncStatus.className = 'status-indicator status-online';
                    syncStatus.innerHTML = '<span>✅ Synced</span>';
                    this.showToast('Sync completed', 'success');
                }, 2000);
            }

            processSyncQueue() {
